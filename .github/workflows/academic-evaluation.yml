name: Semana 9 - Francisco incremento 1 de 3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalación limpia
        run: npm ci
      - name: Instalar Chromium y dependencias
        run: npx playwright install --with-deps chromium
      - name: Validación, secretos y regresión acumulativa
        run: npm run verify
      - name: E2E y estabilidad de recarga offline (sin reintentos)
        run: npm run test:e2e -- --repeat-each=10
      - name: Conservar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w09-francisco-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/verification.json
            test-results/
            coverage/
            playwright-report/
