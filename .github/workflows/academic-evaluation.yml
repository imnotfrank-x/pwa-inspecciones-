name: Semana 8 - Base unitaria (incremento 1 de 3)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalación limpia
        id: install
        run: npm ci
      - name: Lint, tipos, regresión, unitarias con cobertura y build
        run: make verify
      - name: Alcance del incremento
        if: always()
        run: |
          echo 'Incremento Francisco: integración, E2E y defecto controlado siguen pendientes de Javier/Carlos.' >> "$GITHUB_STEP_SUMMARY"
          echo "SHA comprobado: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar reportes incluso ante fallo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w08-francisco-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/verification.json
            test-results/
            coverage/

# Javier añadirá integración; Carlos añadirá E2E con servidor de producción.
# No es todavía la evidencia de cumplimiento completo de Semana 8.
