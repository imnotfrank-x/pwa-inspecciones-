name: Semana 8 - Verificación completa

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalación limpia
        run: npm ci
      - name: Instalar Chromium y dependencias
        run: npx playwright install --with-deps chromium
      - name: Verificación completa de Semana 8
        run: npm run verify:all
      - name: Conservar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w08-final-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/verification.json
            test-results/
            coverage/
            playwright-report/
